plugins {
    id 'com.android.application'
}

android {
    namespace 'com.panos.aiscreencheck'
    compileSdk 36

    defaultConfig {
        applicationId "com.panos.aiscreencheck"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Bundled on-device OCR fallback. Visible UI text is preferably read via Accessibility.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
